<title>五子棋 · 和我对弈</title>
<style>
:root{color-scheme:light;--ink:#27231e;--muted:#81786c;--wood:#d9a95f;--paper:#f8f4ec;--green:#64765c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#fffdf8 0,#f3ede1 68%);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:26px}
main{width:min(100%,1040px);display:grid;grid-template-columns:minmax(0,660px) 270px;gap:42px;align-items:center}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:700}.title{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,5vw,52px);font-weight:500;letter-spacing:.06em;margin:8px 0 6px}.subtitle{color:var(--muted);font-size:14px;margin:0 0 26px}.game-nav{display:flex;gap:8px;margin:0 0 18px}.game-nav a,.game-nav span{font-size:12px;text-decoration:none;padding:7px 11px;border:1px solid #ded7ca;border-radius:999px;color:#70685c}.game-nav .current{background:var(--ink);color:white;border-color:var(--ink)}.board-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 20px 55px #5b391e30,0 3px 8px #5b391e20;background:#d6a45b}.board-wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#e7c17f55,transparent 50%,#95612a18);pointer-events:none}canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair}.panel{align-self:center}.statusbox{background:#fffdf9;border:1px solid #e9e1d3;border-radius:14px;padding:18px 18px 16px;box-shadow:0 8px 24px #49361c0d}.turn{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}.stone{width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#666,#111 64%);box-shadow:1px 2px 3px #0005;flex:none}.stone.white{background:radial-gradient(circle at 35% 28%,#fff,#eee 68%);border:1px solid #d8d1c4}.caption{font-size:13px;color:var(--muted);line-height:1.65;margin:12px 0 0}.moves{margin:20px 2px 22px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.moves strong{font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}.buttons{display:flex;gap:10px}#mode-toggle{width:100%;margin-top:8px}.btn{border:0;border-radius:9px;padding:12px 15px;font:600 14px inherit;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--ink);color:#fff;flex:1}.secondary{background:#e9e3d8;color:#484037}.hint{margin-top:23px;font-size:12px;line-height:1.8;color:#918777}.hint strong{color:#675f53}.result{color:#7b4f21}.footer{margin-top:18px;font-size:11px;color:#aaa092;letter-spacing:.08em}

</style></head><body><main><section><div class="eyebrow">A QUIET MATCH · 01</div><h1 class="title">五子棋</h1><p class="subtitle">棋落无悔，慢慢来。</p><nav class="game-nav"><span class="current">五子棋</span><a href="minesweeper.html">扫雷 ↗</a></nav><div class="board-wrap"><canvas id="board" aria-label="五子棋棋盘"></canvas></div></section><aside class="panel"><div class="statusbox"><div class="turn"><span class="stone" id="turnStone"></span><span id="status">轮到你了</span></div><p class="caption" id="caption">你执黑先行。点击棋盘交叉点落子。</p></div><div class="moves"><span>对局手数</span><strong id="count">0</strong></div><div class="buttons"><button class="btn primary" id="restart">重新开局</button><button class="btn secondary" id="undo">悔棋</button></div><button class="btn secondary" id="mode-toggle" type="button" aria-pressed="false">切换为后手模式</button><p class="hint"><strong id="role-label">你执黑 · 先手</strong><br>在棋盘上连成五子即可获胜。<br>你也可以切换为后手，让我先下黑棋。</p><div class="footer">15 × 15 · LOCAL MATCH</div></aside></main>
