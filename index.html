<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五子棋 · 和我对弈</title>
<style>
:root{color-scheme:light;--ink:#27231e;--muted:#81786c;--wood:#d9a95f;--paper:#f8f4ec;--green:#64765c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#fffdf8 0,#f3ede1 68%);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:26px}
main{width:min(100%,1040px);display:grid;grid-template-columns:minmax(0,660px) 270px;gap:42px;align-items:center}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:700}.title{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,5vw,52px);font-weight:500;letter-spacing:.06em;margin:8px 0 6px}.subtitle{color:var(--muted);font-size:14px;margin:0 0 26px}.board-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 20px 55px #5b391e30,0 3px 8px #5b391e20;background:#d6a45b}.board-wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#e7c17f55,transparent 50%,#95612a18);pointer-events:none}canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair}.panel{align-self:center}.statusbox{background:#fffdf9;border:1px solid #e9e1d3;border-radius:14px;padding:18px 18px 16px;box-shadow:0 8px 24px #49361c0d}.turn{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}.stone{width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#666,#111 64%);box-shadow:1px 2px 3px #0005;flex:none}.stone.white{background:radial-gradient(circle at 35% 28%,#fff,#eee 68%);border:1px solid #d8d1c4}.caption{font-size:13px;color:var(--muted);line-height:1.65;margin:12px 0 0}.moves{margin:20px 2px 22px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.moves strong{font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}.buttons{display:flex;gap:10px}.btn{border:0;border-radius:9px;padding:12px 15px;font:600 14px inherit;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--ink);color:#fff;flex:1}.secondary{background:#e9e3d8;color:#484037}.hint{margin-top:23px;font-size:12px;line-height:1.8;color:#918777}.hint strong{color:#675f53}.result{color:#7b4f21}.footer{margin-top:18px;font-size:11px;color:#aaa092;letter-spacing:.08em}
@media(max-width:820px){body{padding:20px 14px}main{grid-template-columns:1fr;gap:18px;max-width:600px}.subtitle{margin-bottom:16px}.panel{width:100%}.statusbox{padding:14px 16px}.moves{margin:12px 2px 14px}.hint,.footer{display:none}}
</style></head><body><main><section><div class="eyebrow">A QUIET MATCH · 01</div><h1 class="title">五子棋</h1><p class="subtitle">棋落无悔，慢慢来。</p><div class="board-wrap"><canvas id="board" aria-label="五子棋棋盘"></canvas></div></section><aside class="panel"><div class="statusbox"><div class="turn"><span class="stone" id="turnStone"></span><span id="status">轮到你了</span></div><p class="caption" id="caption">你执黑先行。点击棋盘交叉点落子。</p></div><div class="moves"><span>对局手数</span><strong id="count">0</strong></div><div class="buttons"><button class="btn primary" id="restart">重新开局</button><button class="btn secondary" id="undo">悔棋</button></div><p class="hint"><strong>你的颜色 · 黑棋</strong><br>在棋盘上连成五子即可获胜。<br>我会在每一步之后落下白子。</p><div class="footer">15 × 15 · LOCAL MATCH</div></aside></main>
<script>
(()=>{const N=15, canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');let grid,history,over=false,busy=false,last=null;const status=document.querySelector('#status'),caption=document.querySelector('#caption'),turnStone=document.querySelector('#turnStone'),count=document.querySelector('#count');
function reset(){grid=Array.from({length:N},()=>Array(N).fill(0));history=[];over=false;busy=false;last=null;status.textContent='轮到你了';caption.textContent='你执黑先行。点击棋盘交叉点落子。';turnStone.className='stone';render()}
function render(){const dpr=window.devicePixelRatio||1,size=canvas.clientWidth;canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size);const pad=size*.065,step=(size-pad*2)/(N-1);ctx.strokeStyle='#70491f';ctx.lineWidth=Math.max(1,size/570);for(let i=0;i<N;i++){let p=pad+i*step;ctx.beginPath();ctx.moveTo(pad,p);ctx.lineTo(size-pad,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,pad);ctx.lineTo(p,size-pad);ctx.stroke()}for(const [x,y] of [[3,3],[7,3],[11,3],[3,7],[7,7],[11,7],[3,11],[7,11],[11,11]]){ctx.beginPath();ctx.arc(pad+x*step,pad+y*step,size*.006,0,Math.PI*2);ctx.fillStyle='#70491f';ctx.fill()}for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x]){let px=pad+x*step,py=pad+y*step,r=step*.43;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=grid[y][x]===1?'#171615':'#fffdf6';ctx.shadowColor='#0004';ctx.shadowBlur=4;ctx.shadowOffsetY=2;ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;if(grid[y][x]===2){ctx.strokeStyle='#c8c1b5';ctx.lineWidth=1;ctx.stroke()}if(last&&last[0]===x&&last[1]===y){ctx.fillStyle=grid[y][x]===1?'#f2eee5':'#6a6258';ctx.fillRect(px-2,py-2,4,4)}}count.textContent=history.length}
function won(x,y,c){for(const [dx,dy]of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(const s of [-1,1]){let a=x+dx*s,b=y+dy*s;while(a>=0&&a<N&&b>=0&&b<N&&grid[b][a]===c){n++;a+=dx*s;b+=dy*s}}if(n>=5)return true}return false}
function place(x,y,c){if(grid[y][x])return false;grid[y][x]=c;history.push([x,y,c]);last=[x,y];render();return true}
function finish(c){over=true;busy=false;const text=c===1?'你赢了！':'这局我赢啦';status.textContent=text;caption.textContent='好棋。重新开局，再来一盘？';status.classList.add('result');turnStone.className='stone '+(c===2?'white':'');}
function value(x,y,c){let total=0;for(const[dx,dy]of [[1,0],[0,1],[1,1],[1,-1]]){let own=1,open=0;for(const s of [-1,1]){let a=x+dx*s,b=y+dy*s;while(a>=0&&a<N&&b>=0&&b<N&&grid[b][a]===c){own++;a+=dx*s;b+=dy*s}if(a>=0&&a<N&&b>=0&&b<N&&grid[b][a]===0)open++}let weights=own>=5?100000:own===4&&open===2?12000:own===4&&open===1?2500:own===3&&open===2?1000:own===3&&open===1?180:own===2&&open===2?90:own===2&&open===1?18:1;total+=weights}return total}
function aiMove(){let best=null,bestScore=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!grid[y][x]){if(!history.length&&x===7&&y===7)return [7,7];if(!history.some(([a,b])=>Math.abs(a-x)<=2&&Math.abs(b-y)<=2))continue;grid[y][x]=2;let atk=value(x,y,2);grid[y][x]=1;let def=value(x,y,1);grid[y][x]=0;let score=atk*1.03+def*.96+Math.random()*3;if(score>bestScore){bestScore=score;best=[x,y]}}return best||[7,7]}
canvas.addEventListener('click',e=>{if(over||busy)return;const rect=canvas.getBoundingClientRect(),size=rect.width,pad=size*.065,step=(size-pad*2)/(N-1),x=Math.round((e.clientX-rect.left-pad)/step),y=Math.round((e.clientY-rect.top-pad)/step);if(x<0||x>=N||y<0||y>=N||Math.hypot(e.clientX-rect.left-(pad+x*step),e.clientY-rect.top-(pad+y*step))>step*.48)return;if(!place(x,y,1))return;status.classList.remove('result');if(won(x,y,1)){finish(1);return}busy=true;status.textContent='我在想…';caption.textContent='白棋思考中。';turnStone.className='stone white';setTimeout(()=>{const [a,b]=aiMove();place(a,b,2);if(won(a,b,2)){finish(2);return}busy=false;status.textContent='轮到你了';caption.textContent='你执黑，轮到你落子。';turnStone.className='stone'},420)});
document.querySelector('#restart').onclick=reset;document.querySelector('#undo').onclick=()=>{if(busy||over||!history.length)return;history.pop();if(history.length&&history[history.length-1][2]===1)history.pop();grid=Array.from({length:N},()=>Array(N).fill(0));for(const[x,y,c]of history)grid[y][x]=c;last=history.length?history[history.length-1].slice(0,2):null;status.textContent='轮到你了';caption.textContent='悔棋一步。继续你的回合。';turnStone.className='stone';render()};window.addEventListener('resize',render);reset()})();
</script></body></html>
