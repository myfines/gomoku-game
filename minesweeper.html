<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3ede1"><title>扫雷 · 安静排查</title>
<style>
:root{color-scheme:light;--ink:#27231e;--muted:#81786c;--green:#64765c;--paper:#f8f4ec;--line:#ded7ca;--cell:#e6e0d5;--cell-dark:#d1c9bc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#fffdf8 0,#f3ede1 68%);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:26px}
main{width:min(100%,960px)}header{margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:700}.title{font-family:Georgia,"Songti SC",serif;font-size:clamp(34px,5vw,50px);font-weight:500;letter-spacing:.06em;margin:8px 0 4px}.subtitle{color:var(--muted);font-size:14px;margin:0}.game-nav{display:flex;gap:8px;margin-top:16px}.game-nav a,.game-nav span{font-size:12px;text-decoration:none;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:#70685c}.game-nav .current{background:var(--ink);color:white;border-color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:24px;align-items:start}.board-card,.side-card{background:#fffdf9;border:1px solid #e9e1d3;border-radius:16px;box-shadow:0 8px 24px #49361c0d}.board-card{padding:18px;overflow:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.status{font-size:14px;font-weight:650;color:#514a40}.face{font-size:22px;background:#f2eee7;border:1px solid var(--line);border-radius:9px;width:40px;height:36px;cursor:pointer}.counters{display:flex;gap:8px}.counter{background:#2a2825;color:#f1d78f;font:700 18px ui-monospace,monospace;letter-spacing:.08em;border-radius:7px;padding:7px 9px;min-width:57px;text-align:center}.board-scroll{overflow:auto;padding-bottom:3px}.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));width:min(100%,calc(var(--cols)*38px),800px);min-width:calc(var(--cols)*25px);margin:0 auto;gap:2px;user-select:none}.cell{aspect-ratio:1;border:0;border-radius:4px;background:linear-gradient(145deg,#ede8df,#d8d1c6);box-shadow:inset 1px 1px 0 #fff9,inset -1px -1px 0 #bcb4a7;color:#514a40;font-size:clamp(10px,2vw,17px);font-weight:800;padding:0;cursor:pointer;display:grid;place-items:center}.cell:hover:not(.open){filter:brightness(1.045)}.cell.open{background:#f4f0e9;box-shadow:inset 0 0 0 1px #e4ddd0;cursor:default}.cell.flagged{color:#c04c3e}.cell.mine{background:#f4d9d2;color:#a8332d}.n1{color:#3d6fa2}.n2{color:#4d7b51}.n3{color:#c14a3d}.n4{color:#655395}.n5{color:#905b38}.n6{color:#31938c}.n7{color:#3c3833}.n8{color:#999084}.side{display:grid;gap:12px}.side-card{padding:16px}.side-title{font-weight:700;font-size:14px;margin:0 0 12px}.control{display:grid;gap:7px}.control label{font-size:12px;color:var(--muted)}select,.tool-btn,.new-btn{width:100%;border:1px solid var(--line);border-radius:9px;background:#fffdf9;color:var(--ink);padding:10px 11px;font:600 13px inherit;cursor:pointer}.new-btn{background:var(--ink);border-color:var(--ink);color:white}.tool-btn.active{background:#f7eee2;border-color:#bd8955;color:#8c592e}.tips{font-size:12px;color:var(--muted);line-height:1.75;margin:0}.tips b{color:#5d554a}.foot{font-size:11px;color:#aaa092;letter-spacing:.08em;text-align:center;margin-top:17px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){body{padding:19px 12px;place-items:start center}.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;align-items:stretch}.side-card{padding:13px}.board-card{padding:12px}.board{gap:1px}.cell{border-radius:2px}.foot{display:none}}
@media(max-width:460px){.side{grid-template-columns:1fr 1fr}.tips{font-size:11px}}
</style>
</head><body><main>
<header><div class="eyebrow">A QUIET LITTLE PUZZLE · 02</div><h1 class="title">扫雷</h1><p class="subtitle">慢一点，找出所有安全的格子。</p><nav class="game-nav" aria-label="选择游戏"><a href="index.html">五子棋</a><span class="current">扫雷</span></nav></header>
<div class="layout"><section class="board-card" aria-label="扫雷游戏区"><div class="topline"><div id="game-status" class="status" aria-live="polite">选一个格子开始</div><div class="counters"><span id="mines-left" class="counter" aria-label="剩余地雷">010</span><span id="clock" class="counter" aria-label="用时">000</span></div><button id="face" class="face" type="button" aria-label="重新开始">🙂</button></div><div class="board-scroll"><div id="mine-board" class="board" role="grid" aria-label="扫雷棋盘"></div></div></section>
<aside class="side"><div class="side-card"><h2 class="side-title">新开一局</h2><div class="control"><label for="level">难度</label><select id="level"><option value="easy">初级 · 9 × 9 · 10 雷</option><option value="medium">中级 · 16 × 16 · 40 雷</option><option value="hard">高级 · 30 × 16 · 99 雷</option></select><button id="new-game" class="new-btn" type="button">重新开始</button></div></div>
<div class="side-card"><h2 class="side-title">操作说明</h2><button id="flag-mode" class="tool-btn" type="button" aria-pressed="false">⚑　标记模式</button><p class="tips" style="margin-top:10px">点格子揭开，点<strong>标记模式</strong>后插旗。电脑上也可右键插旗。<br>第一次落点保证安全。</p></div></aside></div><div class="foot">3 LEVELS · FIRST CLICK SAFE</div>
</main><script src="minesweeper.js"></script></body></html>
